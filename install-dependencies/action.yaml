name: Install Dependencies
description: GitHub Action that installs dependencies in a Node based repository
inputs:
  checkout-repo:
    required: false
    description: Perform checkout as first step of action
    default: "true"
  github-token:
    required: true
    description: GitHub token that can checkout the repository. e.g. 'secrets.GITHUB_TOKEN'
    default: ${{ github.token }}
  npm-auth-token:
    required: false
    description: The Node Package Manager (npm) authentication token. This token is used to authenticate against a private NPM registry configured via a .npmrc file.
  npm-token:
    required: false
    description: The Node Package Manager (npm) authentication token. This token is used to authenticate against the NPM registry.
  s3-bucket-name:
    required: false
    description: S3 bucket name to cache node_modules to speed up dependency installation.
  s3-bucket-region:
    required: false
    description: S3 bucket region to cache node_modules to speed up dependency installation.
outputs:
  cache-hit:
    description: Whether the cache was hit when installing dependencies
    value: ${{ steps.read_cache.outputs.cache-hit }}
  package-manager:
    description: The package manager used to install dependencies (yarn, npm, pnpm, or bun)
    value: ${{ steps.detect_pm.outputs.package_manager_public }}
runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@v7
      if: inputs.checkout-repo == 'true'
      with:
        fetch-depth: 0
    - name: Setup tools
      uses: open-turo/action-setup-tools@v3
    - name: Detect package manager
      id: detect_pm
      shell: bash
      run: |
        if [ -f bun.lock ] || [ -f bun.lockb ]; then
          echo "package_manager=bun" >> "$GITHUB_OUTPUT"
          echo "package_manager_public=bun" >> "$GITHUB_OUTPUT"
        elif [ -f pnpm-lock.yaml ]; then
          echo "package_manager=pnpm" >> "$GITHUB_OUTPUT"
          echo "package_manager_public=pnpm" >> "$GITHUB_OUTPUT"
        elif [ -f yarn.lock ]; then
          YARN_MAJOR=$(node -e "try{const p=JSON.parse(require('fs').readFileSync('package.json','utf8'));const m=(p.packageManager||'').match(/^yarn@(\d+)/);process.stdout.write(m?m[1]:'1');}catch(e){process.stdout.write('1');}" 2>/dev/null || echo "1")
          if [ "${YARN_MAJOR:-1}" -ge "2" ] 2>/dev/null; then
            echo "package_manager=yarn-berry" >> "$GITHUB_OUTPUT"
          else
            echo "package_manager=yarn" >> "$GITHUB_OUTPUT"
          fi
          echo "package_manager_public=yarn" >> "$GITHUB_OUTPUT"
        else
          echo "package_manager=npm" >> "$GITHUB_OUTPUT"
          echo "package_manager_public=npm" >> "$GITHUB_OUTPUT"
        fi
    - name: Setup pnpm
      if: steps.detect_pm.outputs.package_manager == 'pnpm'
      uses: pnpm/action-setup@v4
    - name: Setup Bun
      if: steps.detect_pm.outputs.package_manager == 'bun'
      uses: oven-sh/setup-bun@v2
    - name: Enable corepack for Yarn Berry
      if: steps.detect_pm.outputs.package_manager == 'yarn-berry'
      shell: bash
      run: corepack enable
    - name: Compute lockfile hash
      if: inputs.s3-bucket-name != ''
      id: lockfile_hash
      shell: bash
      run: |
        PM="${{ steps.detect_pm.outputs.package_manager }}"
        if [ "$PM" = "bun" ]; then
          echo "hash=${{ hashFiles('**/bun.lock', '**/bun.lockb') }}" >> "$GITHUB_OUTPUT"
        elif [ "$PM" = "pnpm" ]; then
          echo "hash=${{ hashFiles('**/pnpm-lock.yaml') }}" >> "$GITHUB_OUTPUT"
        elif [ "$PM" = "yarn" ] || [ "$PM" = "yarn-berry" ]; then
          echo "hash=${{ hashFiles('**/yarn.lock') }}" >> "$GITHUB_OUTPUT"
        else
          echo "hash=${{ hashFiles('**/package-lock.json') }}" >> "$GITHUB_OUTPUT"
        fi
    - name: Load cached node_modules if available
      if: inputs.s3-bucket-name != ''
      uses: everpcpc/actions-cache@v3
      id: read_cache
      with:
        bucket: ${{ inputs.s3-bucket-name }}
        use-fallback: true
        path: node_modules
        key: ${{ env.cache-name }}-${{ runner.arch }}-${{ steps.lockfile_hash.outputs.hash }}
        restore-keys: ${{ env.cache-name }}-${{ runner.arch }}-
      env:
        AWS_REGION: ${{ inputs.s3-bucket-region }}
        cache-name: ${{ github.event.repository.name }}/cache-node-modules
    - name: Install dependencies (bun)
      if: steps.detect_pm.outputs.package_manager == 'bun'
      shell: bash
      run: bun install --frozen-lockfile
      env:
        NPM_AUTH_TOKEN: ${{ inputs.npm-auth-token }}
    - name: Install dependencies (pnpm)
      if: steps.detect_pm.outputs.package_manager == 'pnpm'
      shell: bash
      run: pnpm install --frozen-lockfile
      env:
        NPM_AUTH_TOKEN: ${{ inputs.npm-auth-token }}
    - name: Install dependencies (yarn berry)
      if: steps.detect_pm.outputs.package_manager == 'yarn-berry'
      shell: bash
      run: yarn install --immutable
      env:
        NPM_AUTH_TOKEN: ${{ inputs.npm-auth-token }}
    - name: Install dependencies (yarn)
      if: steps.detect_pm.outputs.package_manager == 'yarn'
      shell: bash
      run: yarn --frozen-lockfile
      env:
        NPM_AUTH_TOKEN: ${{ inputs.npm-auth-token }}
    - name: Install dependencies (npm)
      if: steps.detect_pm.outputs.package_manager == 'npm'
      shell: bash
      run: npm ci
      env:
        NPM_AUTH_TOKEN: ${{ inputs.npm-auth-token }}
