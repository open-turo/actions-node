name: Install Dependencies
description: GitHub Action that installs dependencies in a Node based repository
inputs:
  checkout-repo:
    required: false
    description: Perform checkout as first step of action
    default: "true"
  github-token:
    required: true
    description: GitHub token that can checkout the repository. e.g. 'secrets.GITHUB_TOKEN'
    default: ${{ github.token }}
  npm-auth-token:
    required: false
    description: The Node Package Manager (npm) authentication token. This token is used to authenticate against a private NPM registry configured via a .npmrc file.
  npm-token:
    required: false
    description: The Node Package Manager (npm) authentication token. This token is used to authenticate against the NPM registry.
  s3-bucket-name:
    required: false
    description: S3 bucket name to cache node_modules to speed up dependency installation.
  s3-bucket-region:
    required: false
    description: S3 bucket region to cache node_modules to speed up dependency installation.
outputs:
  cache-hit:
    description: Whether the cache was hit when installing dependencies
    value: ${{ steps.read_cache.outputs.cache-hit }}
  package-manager:
    description: The package manager used to install dependencies (yarn, npm, pnpm, or bun)
    value: ${{ steps.detect_pm.outputs.package_manager_public }}
runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@v7
      if: inputs.checkout-repo == 'true'
      with:
        fetch-depth: 0
    - name: Setup tools
      uses: open-turo/action-setup-tools@v3
    - name: Detect package manager
      id: detect_pm
      shell: bash
      run: |
        # Primary: packageManager field in package.json. Fallback: lockfile presence.
        PM_FIELD=$(node -e "try{const p=JSON.parse(require('fs').readFileSync('package.json','utf8'));const m=(p.packageManager||'').match(/^([^@]+)/);process.stdout.write(m?m[1]:'');}catch(e){}" 2>/dev/null || echo "")
        YARN_MAJOR=$(node -e "try{const p=JSON.parse(require('fs').readFileSync('package.json','utf8'));const m=(p.packageManager||'').match(/^yarn@(\d+)/);process.stdout.write(m?m[1]:'1');}catch(e){process.stdout.write('1');}" 2>/dev/null || echo "1")

        if [ "$PM_FIELD" = "bun" ] || ([ "$PM_FIELD" != "pnpm" ] && [ "$PM_FIELD" != "npm" ] && ([ -f bun.lock ] || [ -f bun.lockb ])); then
          echo "package_manager=bun" >> "$GITHUB_OUTPUT"
          echo "package_manager_public=bun" >> "$GITHUB_OUTPUT"
        elif [ "$PM_FIELD" = "pnpm" ] || ([ "$PM_FIELD" != "bun" ] && [ "$PM_FIELD" != "npm" ] && [ -f pnpm-lock.yaml ]); then
          echo "package_manager=pnpm" >> "$GITHUB_OUTPUT"
          echo "package_manager_public=pnpm" >> "$GITHUB_OUTPUT"
        elif [ -f yarn.lock ] && [ "$PM_FIELD" != "npm" ] && [ "$PM_FIELD" != "bun" ] && [ "$PM_FIELD" != "pnpm" ]; then
          if [ "${YARN_MAJOR:-1}" -ge "2" ] 2>/dev/null; then
            echo "package_manager=yarn-berry" >> "$GITHUB_OUTPUT"
          else
            echo "package_manager=yarn" >> "$GITHUB_OUTPUT"
          fi
          echo "package_manager_public=yarn" >> "$GITHUB_OUTPUT"
        else
          echo "package_manager=npm" >> "$GITHUB_OUTPUT"
          echo "package_manager_public=npm" >> "$GITHUB_OUTPUT"
        fi
    - name: Setup pnpm
      if: steps.detect_pm.outputs.package_manager == 'pnpm'
      uses: pnpm/action-setup@v4
    - name: Setup Bun
      if: steps.detect_pm.outputs.package_manager == 'bun'
      uses: oven-sh/setup-bun@v2
    - name: Enable corepack for Yarn Berry
      if: steps.detect_pm.outputs.package_manager == 'yarn-berry'
      shell: bash
      run: corepack enable
    - name: Configure private registry auth (pnpm/bun)
      if: >-
        steps.detect_pm.outputs.package_manager == 'pnpm' ||
        steps.detect_pm.outputs.package_manager == 'bun'
      shell: bash
      env:
        NPM_AUTH_TOKEN_INPUT: ${{ inputs.npm-auth-token }}
      run: |
        [ -z "$NPM_AUTH_TOKEN_INPUT" ] && exit 0
        # pnpm blocks ${VAR} expansion in project .npmrc since v11.5.3 (June 2026 security fix).
        # bun reads ~/.npmrc but we write here for reliability.
        # Reads registry URLs from project .npmrc and writes _auth to user-level ~/.npmrc.
        while IFS= read -r line; do
          reg=$(echo "$line" | sed 's/.*:registry=//' | tr -d '[:space:]')
          [ -z "$reg" ] && continue
          reg_key="${reg#https:}"
          echo "${reg_key}:_auth=$NPM_AUTH_TOKEN_INPUT" >> ~/.npmrc
          echo "${reg_key}:always-auth=true" >> ~/.npmrc
        done < <(grep ':registry=' .npmrc 2>/dev/null)
    - name: Configure private registry auth (Yarn Berry)
      if: steps.detect_pm.outputs.package_manager == 'yarn-berry'
      shell: bash
      env:
        NPM_AUTH_TOKEN_INPUT: ${{ inputs.npm-auth-token }}
      run: |
        [ -z "$NPM_AUTH_TOKEN_INPUT" ] && exit 0
        # Write auth directly to ~/.yarnrc.yml — avoids `yarn config set` quoting issues
        # and corepack version ambiguity. Appends only if npmRegistries not yet present.
        node - << 'JSEOF'
        const fs = require('fs'), os = require('os'), path = require('path');
        const token = process.env.NPM_AUTH_TOKEN_INPUT;
        const yarnrcPath = path.join(os.homedir(), '.yarnrc.yml');
        let existing = ''; try { existing = fs.readFileSync(yarnrcPath, 'utf8'); } catch(e) {}
        let npmrc = ''; try { npmrc = fs.readFileSync('.npmrc', 'utf8'); } catch(e) { process.exit(0); }
        const regs = npmrc.split('\n')
          .filter(l => /:registry=/.test(l))
          .map(l => l.split(':registry=')[1]?.trim())
          .filter(Boolean);
        if (!regs.length) process.exit(0);
        let toAppend = existing.includes('npmRegistries') ? '' : 'npmRegistries:\n';
        for (const reg of regs) {
          const key = reg.replace(/^https:/, '');
          if (existing.includes(key)) continue;
          toAppend += `  "${key}":\n    npmAuthIdent: "${token}"\n    npmAlwaysAuth: true\n`;
        }
        if (toAppend) { fs.appendFileSync(yarnrcPath, toAppend); console.log('Berry auth written to ~/.yarnrc.yml'); }
        JSEOF
    - name: Compute lockfile hash
      if: inputs.s3-bucket-name != ''
      id: lockfile_hash
      shell: bash
      run: |
        PM="${{ steps.detect_pm.outputs.package_manager }}"
        if [ "$PM" = "bun" ]; then
          echo "hash=${{ hashFiles('**/bun.lock', '**/bun.lockb') }}" >> "$GITHUB_OUTPUT"
        elif [ "$PM" = "pnpm" ]; then
          echo "hash=${{ hashFiles('**/pnpm-lock.yaml') }}" >> "$GITHUB_OUTPUT"
        elif [ "$PM" = "yarn" ] || [ "$PM" = "yarn-berry" ]; then
          echo "hash=${{ hashFiles('**/yarn.lock') }}" >> "$GITHUB_OUTPUT"
        else
          echo "hash=${{ hashFiles('**/package-lock.json') }}" >> "$GITHUB_OUTPUT"
        fi
    - name: Load cached node_modules if available
      if: inputs.s3-bucket-name != ''
      uses: everpcpc/actions-cache@v3
      id: read_cache
      with:
        bucket: ${{ inputs.s3-bucket-name }}
        use-fallback: true
        path: node_modules
        key: ${{ env.cache-name }}-${{ runner.arch }}-${{ steps.lockfile_hash.outputs.hash }}
        restore-keys: ${{ env.cache-name }}-${{ runner.arch }}-
      env:
        AWS_REGION: ${{ inputs.s3-bucket-region }}
        cache-name: ${{ github.event.repository.name }}/cache-node-modules
    - name: Install dependencies (bun)
      if: steps.detect_pm.outputs.package_manager == 'bun'
      shell: bash
      run: bun install --frozen-lockfile
      env:
        NPM_AUTH_TOKEN: ${{ inputs.npm-auth-token }}
    - name: Install dependencies (pnpm)
      if: steps.detect_pm.outputs.package_manager == 'pnpm'
      shell: bash
      run: pnpm install --frozen-lockfile
      env:
        NPM_AUTH_TOKEN: ${{ inputs.npm-auth-token }}
    - name: Install dependencies (yarn berry)
      if: steps.detect_pm.outputs.package_manager == 'yarn-berry'
      shell: bash
      run: yarn install --immutable
      env:
        NPM_AUTH_TOKEN: ${{ inputs.npm-auth-token }}
    - name: Install dependencies (yarn)
      if: steps.detect_pm.outputs.package_manager == 'yarn'
      shell: bash
      run: yarn --frozen-lockfile
      env:
        NPM_AUTH_TOKEN: ${{ inputs.npm-auth-token }}
    - name: Install dependencies (npm)
      if: steps.detect_pm.outputs.package_manager == 'npm'
      shell: bash
      run: npm ci
      env:
        NPM_AUTH_TOKEN: ${{ inputs.npm-auth-token }}
